services:
  rob-english-word-cloze-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: rob-english-word-cloze-web:1.0.0
    container_name: rob-english-word-cloze-web
    restart: unless-stopped
    labels:
      easy-deploy.project: "rob-english-word-cloze-web"
      easy-deploy.container: "rob-english-word-cloze-web"
    ports:
      - "${CLOZE_WEB_PORT:?runtime config is required}:80"
    environment:
      ROB_WORD_HTTP_PORT: "${ROB_WORD_HTTP_PORT:?runtime config is required}"
      DASHBOARD_SERVER_PORT: "${DASHBOARD_SERVER_PORT:?runtime config is required}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
