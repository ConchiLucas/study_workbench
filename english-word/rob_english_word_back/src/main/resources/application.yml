# Application Configuration
spring:
  application:
    name: rob-english-word

  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/rob_english_word}
    username: ${SPRING_DATASOURCE_USERNAME:rob_word}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50
      max-lifetime: 3600000
      connection-timeout: 30000
      pool-name: RobWordHikariCP

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 10000
      lettuce:
        pool:
          max-active: 50
          max-idle: 10
          min-idle: 5

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 6012
  servlet:
    context-path: /

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:change-this-jwt-secret-to-a-long-random-value}
  expiration: ${JWT_EXPIRATION:86400000}
  header: Authorization
  prefix: Bearer

# Game Configuration
game:
  words-per-player: 5
  grab-duration: 6
  answer-duration: 3
  player-state:
    ttl-seconds: 1800
  matching:
    initial-range: 5
    max-range: 50
    check-interval: 500
    max-wait-time: 30000
    reconnect-grace-seconds: 15
  exp:
    win-base: 100
    lose-base: 20

# Logging
logging:
  level:
    com.robword: DEBUG
    org.springframework.web: INFO

netty:
  websocket:
    port: 6013
    read-idle-seconds: 300

word-agent:
  base-url: http://127.0.0.1:6017
